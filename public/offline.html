<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f7f6">
<title>FoodLog · offline</title>
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; height: 100%; background: #f5f7f6; color: #1c2521;
    font-family: Geist, -apple-system, system-ui, sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; padding: 24px 16px; box-sizing: border-box; text-align: center; }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { font-size: 1.25rem; margin: 8px 0 0; }
  p { margin: 0; color: #5b6660; max-width: 30ch; line-height: 1.45; }
  button { margin-top: 12px; border: 0; border-radius: 12px; padding: 12px 22px;
    background: #1f7a55; color: #fff; font: inherit; font-weight: 600; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>No connection</h1>
  <p>Your diary lives online, so FoodLog needs the internet to open. Nothing you logged is lost.</p>
  <button onclick="location.reload()">Try again</button>
</main>
<script>addEventListener("online", () => location.reload());</script>
</body>
</html>
